<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Workspace as Context architecture</title>
  <desc id="description">The agent contract routes between evidence, linked knowledge, current context, and independent projects</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="22" fill="#F8FAFC"/>
  <text x="600" y="48" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#334155">THE WORKSPACE IS THE CONTEXT LAYER</text>

  <g filter="url(#shadow)">
    <rect x="250" y="76" width="700" height="96" rx="18" fill="url(#panel)"/>
    <text x="600" y="115" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="740" fill="#F8FAFC">Agent contract</text>
    <text x="600" y="143" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#CBD5E1">Structure, workflows, permissions, and definitions of done</text>
  </g>

  <path d="M600 172 V214" stroke="#64748B" stroke-width="2.5"/>
  <path d="M592 205 L600 216 L608 205" fill="none" stroke="#64748B" stroke-width="2.5"/>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="70" y="230" width="300" height="146" rx="18" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
    <text x="220" y="272" text-anchor="middle" font-size="21" font-weight="740" fill="#1E3A8A">Evidence</text>
    <text x="220" y="303" text-anchor="middle" font-size="15" fill="#475569">Raw sources stay unchanged</text>
    <text x="220" y="329" text-anchor="middle" font-size="14" fill="#64748B">PDFs · transcripts · screenshots</text>
    <rect x="125" y="346" width="190" height="25" rx="12.5" fill="#DBEAFE"/>
    <text x="220" y="364" text-anchor="middle" font-size="12" font-weight="650" fill="#1D4ED8">reference-buffer/</text>

    <rect x="450" y="214" width="300" height="178" rx="18" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="600" y="258" text-anchor="middle" font-size="21" font-weight="740" fill="#4C1D95">Compiled knowledge</text>
    <text x="600" y="289" text-anchor="middle" font-size="15" fill="#475569">Small, linked, and maintained</text>
    <text x="600" y="315" text-anchor="middle" font-size="14" fill="#64748B">MOCs · focused notes · cross-links</text>
    <rect x="492" y="337" width="216" height="25" rx="12.5" fill="#EDE9FE"/>
    <text x="600" y="355" text-anchor="middle" font-size="12" font-weight="650" fill="#6D28D9">index.md + domains/</text>
    <rect x="492" y="367" width="216" height="25" rx="12.5" fill="#EDE9FE"/>
    <text x="600" y="385" text-anchor="middle" font-size="12" font-weight="650" fill="#6D28D9">_context.md + log.md</text>

    <rect x="830" y="230" width="300" height="146" rx="18" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
    <text x="980" y="272" text-anchor="middle" font-size="21" font-weight="740" fill="#7C2D12">Independent projects</text>
    <text x="980" y="303" text-anchor="middle" font-size="15" fill="#475569">Clean history and publication</text>
    <text x="980" y="329" text-anchor="middle" font-size="14" fill="#64748B">Code · tests · releases · issues</text>
    <rect x="885" y="346" width="190" height="25" rx="12.5" fill="#FFEDD5"/>
    <text x="980" y="364" text-anchor="middle" font-size="12" font-weight="650" fill="#C2410C">separate Git repos</text>
  </g>

  <path d="M370 303 H438" stroke="#64748B" stroke-width="2.5"/>
  <path d="M429 295 L440 303 L429 311" fill="none" stroke="#64748B" stroke-width="2.5"/>
  <path d="M750 303 H818" stroke="#64748B" stroke-width="2.5"/>
  <path d="M809 295 L820 303 L809 311" fill="none" stroke="#64748B" stroke-width="2.5"/>

  <rect x="250" y="438" width="700" height="48" rx="24" fill="#E2E8F0"/>
  <text x="600" y="468" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#334155">Start small · follow links · verify changes · preserve evidence</text>
</svg>
