<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Workspace as Context</title>
  <desc id="description">A plain-text architecture for humans and AI agents</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090E1A"/>
      <stop offset="0.52" stop-color="#111B33"/>
      <stop offset="1" stop-color="#25134D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="1020" cy="80" r="130" fill="#7C3AED" opacity="0.18" filter="url(#glow)"/>
  <circle cx="180" cy="330" r="150" fill="#2563EB" opacity="0.14" filter="url(#glow)"/>
  <path d="M80 91 H1120" stroke="url(#accent)" stroke-width="3" opacity="0.8"/>

  <text x="600" y="168" fill="#F8FAFC" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="760" letter-spacing="-1.5">Workspace as Context</text>
  <text x="600" y="211" fill="#B8C5DC" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">A plain-text architecture for humans and AI agents</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="middle">
    <rect x="267" y="258" width="190" height="48" rx="24" fill="#17233E" stroke="#60A5FA" stroke-opacity="0.7"/>
    <text x="362" y="288" fill="#BFDBFE">1. Evidence</text>

    <path d="M476 282 H526" stroke="#64748B" stroke-width="2"/>
    <path d="M519 275 L528 282 L519 289" fill="none" stroke="#64748B" stroke-width="2"/>

    <rect x="505" y="258" width="190" height="48" rx="24" fill="#201B42" stroke="#A78BFA" stroke-opacity="0.8"/>
    <text x="600" y="288" fill="#DDD6FE">2. Knowledge</text>

    <path d="M714 282 H764" stroke="#64748B" stroke-width="2"/>
    <path d="M757 275 L766 282 L757 289" fill="none" stroke="#64748B" stroke-width="2"/>

    <rect x="743" y="258" width="190" height="48" rx="24" fill="#352017" stroke="#F97316" stroke-opacity="0.8"/>
    <text x="838" y="288" fill="#FED7AA">3. Projects</text>
  </g>
</svg>
