name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit starter workspace
        run: python3 tools/audit_workspace.py starter

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate public repository
        run: python3 tools/validate_repository.py
